services:
  postgres:
    image: postgres:16-alpine
    container_name: gscores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gscores}
      POSTGRES_USER: ${DB_USERNAME:-gscores}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gscores}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gscores} -d ${DB_NAME:-gscores}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

