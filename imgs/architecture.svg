<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <clipPath id="clip-fe"><rect x="28" y="84" width="256" height="464" rx="12"/></clipPath>
    <clipPath id="clip-be"><rect x="336" y="84" width="444" height="464" rx="12"/></clipPath>
    <clipPath id="clip-db"><rect x="832" y="84" width="260" height="332" rx="12"/></clipPath>
    <clipPath id="clip-csv"><rect x="832" y="434" width="260" height="114" rx="12"/></clipPath>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="580" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="28" y="40" font-size="22" font-weight="700" fill="#0F172A">G-Scores System Architecture</text>
  <text x="28" y="62" font-size="13" fill="#475569">React 19 SPA (Vercel / Nginx)  |  Spring Boot 4.1.2 Modular Monolith (Non-root Docker)  |  PostgreSQL 16 / 18 (Flyway V1-V7)</text>

  <!-- ==================== TIER 1: FRONTEND ==================== -->
  <g clip-path="url(#clip-fe)">
    <rect x="28" y="84" width="256" height="464" fill="#FFFFFF"/>
    <rect x="28" y="84" width="256" height="38" fill="#1E3A8A"/>
  </g>
  <rect x="28" y="84" width="256" height="464" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="156" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Frontend SPA Layer</text>

  <rect x="44" y="138" width="224" height="78" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="58" y="160" font-size="13" font-weight="700" fill="#0F172A">User Browser</text>
  <text x="58" y="180" font-size="11.5" fill="#475569">React 19.3 + Vite 8 + Tailwind v4</text>
  <text x="58" y="198" font-size="11.5" fill="#475569">Recharts bar chart, responsive layout</text>

  <rect x="44" y="230" width="224" height="142" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="58" y="252" font-size="13" font-weight="700" fill="#1E3A8A">Routes &amp; Custom Hooks</text>
  <text x="58" y="274" font-size="11.5" fill="#0F172A" font-weight="600">/ (Dashboard)</text>
  <text x="58" y="290" font-size="11" fill="#475569">4-tier distribution + useReportData</text>
  <text x="58" y="312" font-size="11.5" fill="#0F172A" font-weight="600">/search (ScoreLookup)</text>
  <text x="58" y="328" font-size="11" fill="#475569">8-digit SBD lookup + useScoreLookup</text>
  <text x="58" y="350" font-size="11.5" fill="#0F172A" font-weight="600">/reports (Leaderboard)</text>
  <text x="58" y="366" font-size="11" fill="#475569">Top 10 Group A00 + province filter</text>

  <rect x="44" y="386" width="224" height="144" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="58" y="408" font-size="13" font-weight="700" fill="#0F172A">SPA Hosting &amp; Client</text>
  <text x="58" y="429" font-size="11.5" fill="#334155">Vercel: frontend/vercel.json rewrite</text>
  <text x="58" y="447" font-size="11.5" fill="#334155">Docker: Nginx 1.27 SPA + /api/ proxy</text>
  <text x="58" y="468" font-size="11.5" fill="#334155">Axios client (apiClient / gscoresService)</text>
  <text x="58" y="486" font-size="11.5" fill="#334155">In-memory cache &amp; request dedupe</text>
  <text x="58" y="506" font-size="11" fill="#64748B">Fallback mock mode via VITE_USE_MOCK_API</text>

  <!-- ==================== TIER 2: BACKEND ==================== -->
  <g clip-path="url(#clip-be)">
    <rect x="336" y="84" width="444" height="464" fill="#FFFFFF"/>
    <rect x="336" y="84" width="444" height="38" fill="#1E3A8A"/>
  </g>
  <rect x="336" y="84" width="444" height="464" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="558" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Backend Modular Monolith (Spring Boot 4.1.2, Non-root Docker)</text>

  <!-- Controllers & Actuator -->
  <rect x="352" y="138" width="412" height="92" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <text x="366" y="159" font-size="13" font-weight="700" fill="#1E3A8A">REST Controllers &amp; Actuator Probes (:8080)</text>
  <text x="366" y="180" font-size="11.5" fill="#0F172A">/api/v1/students/{sbd}/scores  |  /api/v1/reports/*  |  /api/v1/provinces</text>
  <text x="366" y="199" font-size="11.5" fill="#334155">/actuator/health/liveness (JVM alive)  |  /actuator/health/readiness (db + dataSeeder)</text>
  <text x="366" y="218" font-size="11" fill="#475569">GlobalExceptionHandler maps ServiceUnavailableException to HTTP 503</text>

  <!-- Core Services & Guards -->
  <rect x="352" y="246" width="200" height="150" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="364" y="267" font-size="12.5" font-weight="700" fill="#065F46">Services &amp; Guards</text>
  <text x="364" y="288" font-size="11.5" fill="#0F172A">StudentScoreService</text>
  <text x="364" y="306" font-size="11.5" fill="#0F172A">ReportService (Epoch Cache)</text>
  <text x="364" y="328" font-size="11" font-weight="600" fill="#047857">DataSeedState Atomic Snapshot:</text>
  <text x="364" y="345" font-size="11" fill="#334155">(SeedState, epoch) Entry/Exit</text>
  <text x="364" y="361" font-size="11" fill="#334155">gates reject partial reads &amp;</text>
  <text x="364" y="377" font-size="11" fill="#334155">stale cache writes with HTTP 503</text>

  <!-- OOP Domain & Caches -->
  <rect x="564" y="246" width="200" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="576" y="267" font-size="12.5" font-weight="700" fill="#0F172A">OOP Domain &amp; Caches</text>
  <text x="576" y="288" font-size="11.5" fill="#0F172A">SubjectRegistry (9 subjects)</text>
  <text x="576" y="306" font-size="11" fill="#475569">ExamSubject (abstract)</text>
  <text x="576" y="322" font-size="11" fill="#475569">StandardExamSubject</text>
  <text x="576" y="338" font-size="11" fill="#475569">ForeignLanguageSubject</text>
  <text x="576" y="360" font-size="11.5" fill="#0F172A">ProvinceCache (63 MOET)</text>
  <text x="576" y="378" font-size="11.5" fill="#0F172A">BlockTotalCache (11 blocks)</text>

  <!-- Startup Seeder -->
  <rect x="352" y="412" width="412" height="118" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="366" y="433" font-size="12.5" font-weight="700" fill="#92400E">Startup Verification &amp; Seeder Pipeline (CsvDataSeeder)</text>
  <text x="366" y="454" font-size="11.5" fill="#0F172A">1. Check import_metadata: COMPLETED + 3-table counts match -&gt; READY_EXISTING_DATA</text>
  <text x="366" y="473" font-size="11.5" fill="#0F172A">2. Fail-closed if UNVERIFIED_LEGACY or missing CSV with importer off -&gt; 503</text>
  <text x="366" y="492" font-size="11.5" fill="#0F172A">3. Clean import: SHA-256 DigestInputStream + 5,000-row JDBC TransactionTemplate</text>
  <text x="366" y="511" font-size="11.5" fill="#0F172A">4. Precompute student_block_scores SQL pivot + ANALYZE + mark COMPLETED</text>

  <!-- ==================== TIER 3: DATABASE & CSV ==================== -->
  <g clip-path="url(#clip-db)">
    <rect x="832" y="84" width="260" height="332" fill="#FFFFFF"/>
    <rect x="832" y="84" width="260" height="38" fill="#065F46"/>
  </g>
  <rect x="832" y="84" width="260" height="332" rx="12" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="962" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">PostgreSQL 16 / 18</text>

  <text x="848" y="144" font-size="11.5" font-weight="600" fill="#047857">Flyway V1-V7  |  ~1,425 MB local</text>
  <line x1="848" y1="154" x2="1076" y2="154" stroke="#E2E8F0" stroke-width="1"/>

  <text x="848" y="176" font-size="12" font-weight="700" fill="#0F172A">students</text>
  <text x="1076" y="176" text-anchor="end" font-size="11.5" fill="#475569">1,061,605 rows</text>

  <text x="848" y="204" font-size="12" font-weight="700" fill="#0F172A">exam_scores</text>
  <text x="1076" y="204" text-anchor="end" font-size="11.5" fill="#475569">6,037,435 rows (sparse)</text>

  <text x="848" y="232" font-size="12" font-weight="700" fill="#0F172A">student_block_scores</text>
  <text x="1076" y="232" text-anchor="end" font-size="11.5" fill="#475569">2,627,815 rows (11 blocks)</text>

  <text x="848" y="260" font-size="12" font-weight="700" fill="#0F172A">provinces</text>
  <text x="1076" y="260" text-anchor="end" font-size="11.5" fill="#475569">63 MOET councils (V5)</text>

  <text x="848" y="288" font-size="12" font-weight="700" fill="#0F172A">subjects</text>
  <text x="1076" y="288" text-anchor="end" font-size="11.5" fill="#475569">9 subjects (V2)</text>

  <text x="848" y="316" font-size="12" font-weight="700" fill="#0F172A">import_metadata</text>
  <text x="1076" y="316" text-anchor="end" font-size="11.5" fill="#475569">SHA-256 + status (V6)</text>

  <rect x="848" y="336" width="228" height="64" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="858" y="356" font-size="11" font-weight="600" fill="#065F46">Storage &amp; Index Optimization (V7):</text>
  <text x="858" y="373" font-size="11" fill="#334155">Dropped 107 MB redundant single-col</text>
  <text x="858" y="389" font-size="11" fill="#334155">indexes; UNIQUE prefix scans preserved</text>

  <!-- Raw CSV Card -->
  <g clip-path="url(#clip-csv)">
    <rect x="832" y="434" width="260" height="114" fill="#FFFBEB"/>
    <rect x="832" y="434" width="260" height="34" fill="#B45309"/>
  </g>
  <rect x="832" y="434" width="260" height="114" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="962" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Raw CSV Dataset (Seed-Only)</text>
  <text x="848" y="488" font-size="11.5" font-weight="600" fill="#0F172A">dataset/diem_thi_thpt_2024.csv</text>
  <text x="848" y="508" font-size="11.5" fill="#475569">42.1 MB  |  1,061,605 candidate rows</text>
  <text x="848" y="528" font-size="11" fill="#92400E">Mounted read-only in local Docker Compose</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Frontend -> Backend -->
  <line x1="284" y1="184" x2="348" y2="184" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="310" y="170" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1D4ED8">HTTPS</text>
  <text x="310" y="199" text-anchor="middle" font-size="10" fill="#475569">JSON / CORS</text>

  <!-- Controllers -> Services & OOP -->
  <line x1="452" y1="230" x2="452" y2="244" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="664" y1="230" x2="664" y2="244" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Services <-> OOP -->
  <line x1="552" y1="320" x2="562" y2="320" stroke="#64748B" stroke-width="1.6"/>

  <!-- Backend Queries -> PostgreSQL -->
  <line x1="780" y1="296" x2="829" y2="296" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="806" y="280" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">SQL</text>
  <text x="806" y="311" text-anchor="middle" font-size="10" fill="#475569">JPA / Native</text>

  <!-- CSV -> Seeder -->
  <line x1="832" y1="490" x2="768" y2="490" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="806" y="478" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B45309">Stream</text>

  <!-- Seeder -> PostgreSQL -->
  <path d="M 764 438 L 806 438 L 806 382 L 829 382" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
</svg>

