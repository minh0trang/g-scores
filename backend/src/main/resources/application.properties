spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ==========================================
# PostgreSQL DataSource (Batch Insert Optimized)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gscores?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:gscores}
spring.datasource.password=${DB_PASSWORD:gscores}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==========================================
# JPA / Hibernate (Schema Governance via Flyway)
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# Flyway Migrations
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# CSV Dataset Importer Settings
# ==========================================
app.importer.enabled=${IMPORTER_ENABLED:true}
app.importer.csv-path=${CSV_FILE_PATH:../dataset/diem_thi_thpt_2024.csv}
app.importer.batch-size=${IMPORTER_BATCH_SIZE:5000}

# ==========================================
# CORS Configuration
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost}
